name: Datamart images

# Builds the rebranded web and admin images for one Warmbly release. Every other
# service runs Warmbly's own published image of the same release, so only the
# two apps that carry the brand are built here. Started by Datamart sync, or by
# hand after a change to datamart/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Warmbly release merged into datamart (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: datamart-images-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'asif4347/Warmbly'
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: datamart

      - name: Rebrand
        run: python3 datamart/rebrand.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ inputs.tag }}-datamart
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/asif4347/datamart-warmup/${{ matrix.app }}:${{ inputs.tag }}
            ghcr.io/asif4347/datamart-warmup/${{ matrix.app }}:latest
          cache-from: type=gha,scope=datamart-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=datamart-${{ matrix.app }}
